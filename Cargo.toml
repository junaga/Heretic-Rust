[package]
name = "heretic-rust"
version = "1.4.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
description = "Rust application port of Heretic with Transformers/PyTorch interoperability"

[lib]
name = "heretic"

[[bin]]
name = "heretic"
path = "src/main.rs"

[dependencies]
anyhow = "1"
pyo3 = { version = "0.23", features = ["auto-initialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
